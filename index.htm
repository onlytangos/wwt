  }
}

// Buscador: al escribir, sugerencias en una lista de 10 líneas (eventos y personas cuyo nombre
// contiene lo escrito; primero las que empiezan así). Al elegir una, el listado
// de su tipo (events/seminars o people) en su área, y la ficha a la vista
let buscado = null, encontradas = [], activa = -1;
let soloBuscado = false;   // tras elegir una sugerencia, solo ella (lo quita cambiar área, rol, fecha o el mapa)
const MAX_SUGS = 50;          // coincidencias como mucho (se ven 10, el resto desplazando)
// tipo de una sugerencia, 3 letras como los códigos del selector de rol: EVT, SEM,
// ACA, MIL, LIS; una persona, su primer rol (ORG, ART...) o PEO sin ninguno; un área, ARE; un país, CON; una ciudad, CIT
const tipoSug = p => p.geo || String(p.roles[0] || PEO).slice(0, 3).toUpperCase();
// áreas, países y ciudades de los datos, para las sugerencias: {geo: 'ARE' | 'CON' | 'CIT', nombre,
// area (del país), pais y ciudad ('País|Ciudad', de la ciudad), clave}
let geos = null;
function lugaresSug(){
  if (geos) return geos;
  const areas = new Set(), paises = new Map(), ciudades = new Map();
  for (const p of personas){
    if (p.area && p.area != '-' && p.area != MUNDIAL) areas.add(p.area);
    if (p.pais && p.pais != '-' && p.pais[0] == p.pais[0].toUpperCase()){   // no los de las list de un área (europe)
      paises.set(p.pais, p.area);
      if (p.ciudad && !p.ciudad.startsWith('*')) ciudades.set(ciudadDe(p), {nombre: p.ciudad, pais: p.pais});
    }
  }
  geos = [...[...areas].map(a => ({geo: 'ARE', nombre: a})), ...[...paises].map(([n, a]) => ({geo: 'CON', nombre: n, area: a})),
          ...[...ciudades].map(([k, c]) => ({geo: 'CIT', nombre: c.nombre, pais: c.pais, ciudad: k}))];
  const n = new Map();                           // registros de cada uno, para ordenarlos (Seoul antes que Seogwipo)
  for (const p of personas) for (const k of ['ARE|' + p.area, 'CON|' + p.pais, 'CIT|' + ciudadDe(p)]) n.set(k, (n.get(k) || 0) + 1);
  geos.forEach(g => { g.clave = normaliza(g.nombre); g.n = n.get(g.geo + '|' + (g.geo == 'CIT' ? g.ciudad : g.nombre)) || 0; });
  return geos;
}
const detalle = p => p.geo == 'ARE' ? 'area' : p.geo == 'CON' ? p.area : p.geo == 'CIT' ? p.pais : p.lista ? p.lugar || 'list' : p.evento ? [p.fecha, p.lugar].filter(Boolean).join(' ') || p.tipo : p.lugar || 'people';
const normaliza = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function sugerencias(){ personas.forEach(p => p.clave = normaliza(p.nombre)); }
function muestra(){
  const q = normaliza($('buscar').value.trim()), d = $('sugs');
  // primero las áreas, países y ciudades que coinciden (los de más registros antes), después los
  // registros; en cada grupo, antes los que empiezan así
  const orden = (x, y) => x.clave.startsWith(q) == y.clave.startsWith(q) ? x.nombre.localeCompare(y.nombre) : x.clave.startsWith(q) ? -1 : 1;
  const ordenGeo = (x, y) => x.clave.startsWith(q) == y.clave.startsWith(q) ? y.n - x.n || x.nombre.localeCompare(y.nombre) : x.clave.startsWith(q) ? -1 : 1;
  encontradas = !q ? [] : [...lugaresSug().filter(g => g.clave.includes(q)).sort(ordenGeo),
                           ...personas.filter(p => p.clave.includes(q)).sort(orden)].slice(0, MAX_SUGS);
  activa = encontradas.length ? 0 : -1;
  d.innerHTML = '';
  encontradas.forEach((p, i) => {
    const o = document.createElement('div');
    o.innerHTML = '';
    const tipo = document.createElement('span');   // tipo, en 3 letras: el código del selector de rol
    tipo.className = 'tipo' + (p.geo ? ' geo' + p.geo : '');   // área, país y ciudad: en amarillo
    tipo.textContent = tipoSug(p);
    o.appendChild(tipo);
    o.append(p.nombre + ' ');
    const s = document.createElement('small');
    s.textContent = '— ' + detalle(p);
    o.appendChild(s);
    if (i == activa) o.className = 'activa';
    o.onmousedown = e => { e.preventDefault(); ir(p); };   // antes de que el input pierda el foco
    d.appendChild(o);
  });
  d.classList.toggle('oculto', !encontradas.length);
}
function marca(i){
  activa = (i + encontradas.length) % encontradas.length;
  [...$('sugs').children].forEach((o, k) => o.classList.toggle('activa', k == activa));
  $('sugs').children[activa].scrollIntoView({block: 'nearest'});   // la marcada, siempre a la vista
}
function irGeo(g){
  // sugerencia de un área (al selector), de un país (activado en el mapa, como un click en él)
  // o de una ciudad (su país activado y encuadrado, y solo lo de la ciudad: los eventos aún
  // no tienen su lat/lon, casi todos están en el centro de su ciudad)
  soloBuscado = false;
  lugarSel = ciudadSel = paisSel = buscado = null;
  enListado = true;                              // lo del área o el país, en el listado (y en el mapa)
  if (g.geo == 'ARE'){
    $('selArea').value = g.nombre;
    pinta();
  } else {
    mapaAbierto = true;                          // el filtro de país va con el mapa: se abre
    sinEncuadre = true;                          // este repintado no mueve el mapa: Leaflet descarta
    pinta();                                     // un encuadre si llega con la animación del anterior en
                                                 // marcha (solo crea el mapa y sus países si aún no estaban)
    const pais = g.geo == 'CIT' ? g.pais : g.nombre;   // una ciudad: también su país (iluminado; el área, en blanco)
    if (capaPaises) capaPaises.eachLayer(l => { if (!paisSel && l.feature.properties.nombres.includes(pais)) paisSel = l; });
    if (g.geo == 'CIT') ciudadSel = g.ciudad;
    pinta();
    if (g.geo == 'CIT'){
      const conPos = personas.find(p => ciudadDe(p) == g.ciudad && p.pos);
      if (conPos) etiqueta(conPos.pos, g.nombre, 'ciudad');
    } else if (paisSel) etiqueta(boundsPais(paisSel).getCenter(), g.nombre, 'pais');
  }
  $('buscar').value = '';
  $('sugs').classList.add('oculto');
  $('buscar').blur();
}
function ir(p){
  if (p.geo) return irGeo(p);
  buscado = p;
  soloBuscado = true;
  enListado = true;
  $('selRol').value = p.evento || p.lista ? p.roles[0] : PEO;
  $('selArea').value = p.area == MUNDIAL ? TODOS : p.area;
  fechaSel = F_DOCE;                             // sin filtro de fecha (soloBuscado), lugar ni país: que se vea; luego, YEAR
  lugarSel = ciudadSel = paisSel = null;
  // su país, activado en el mapa (como un click en él): iluminado, encuadrado y con su nombre
  if (capaPaises && mapaAbierto) capaPaises.eachLayer(l => { if (!paisSel && l.feature.properties.nombres.includes(p.pais)) paisSel = l; });
  pinta();
  if (paisSel) etiqueta(p.pos || paisSel.getBounds().getCenter(), paisSel.feature.properties.pais, 'pais');
  iluminaFicha(p);                               // su marcador, iluminado
  const c = document.getElementById('f' + p.id);
  if (c){
    c.classList.add('encontrado');
    c.scrollIntoView({block: 'center'});
  }
  $('buscar').value = '';
  $('sugs').classList.add('oculto');
  $('buscar').blur();
}
function teclaBuscar(e){
  // flechas: sugerencia anterior/siguiente; Enter: ir a ella; Escape: cerrar
  if (!encontradas.length) return;
  if (e.key == 'ArrowDown'){ marca(activa + 1); e.preventDefault(); }
  else if (e.key == 'ArrowUp'){ marca(activa - 1); e.preventDefault(); }
  else if (e.key == 'Enter') ir(encontradas[activa]);
  else if (e.key == 'Escape') $('sugs').classList.add('oculto');
}

function muestraInfo(){
  // ficha de info: solo texto
  $('fCuerpo').innerHTML = '';
  const d = document.createElement('div');
  d.className = 'texto';
  // perfil de FB de KoKoTango: enlace y, en la última línea, invitación a mandar urls (con el sobre, img/mensaje.svg)
  const FB = 'https://www.facebook.com/profile.php?id=100093497583670';
  d.innerHTML = '<p><a href="' + FB + '" target="_blank" rel="noopener">by KoKoTango</a> (public version)</p>' +
                '<p class="enlaces"><a href="' + FB + '" target="_blank" rel="noopener"><img src="img/mensaje.svg" alt="" class="icono">send me a message with your urls</a></p>' +
                '<p>powered by Opus 5.5</p>' +
                '<p class="creditos">map: tiles &copy; <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri</a>, HERE, Garmin, ' +
                '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors; ' +
                'countries: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>; ' +
                '<a href="https://leafletjs.com/" target="_blank" rel="noopener">Leaflet</a></p>';
  $('fCuerpo').appendChild(d);
  $('ficha').showModal();
  return false;
}

function conecta(){
  // los controles de la página: buscador, info, ficha y selectores
  $('buscar').oninput = muestra;
  $('buscar').onfocus = muestra;
  $('buscar').onblur = () => $('sugs').classList.add('oculto');
  $('buscar').onkeydown = teclaBuscar;
  $('info').onclick = muestraInfo;
  $('fCerrar').onclick = () => $('ficha').close();
  $('ficha').onclick = e => { if (e.target == $('ficha')) $('ficha').close(); };   // click fuera: se cierra
  $('dCerrar').onclick = cierraFicha;
  $('bMapa').onclick = abreCierraMapa;
  document.addEventListener('keydown', e => { if (e.key == 'Escape') cierraFicha(); });
  $('selArea').onchange = () => { lugarSel = ciudadSel = paisSel = null; soloBuscado = false; pinta(); };
  // tipo: fuera la ciudad (clicada o sugerida); el país se queda, con su encuadre
  $('selRol').onchange = () => { lugarSel = ciudadSel = null; soloBuscado = false; pinta(); };
  $('bListado').onclick = () => { enListado = !enListado; sinEncuadre = true; pinta(); };   // list: misma selección (país, ciudad) y el mapa quieto
  // área: elegir la misma que ya está también cuenta (la vuelve a poner en el mapa
  // y quita el país y el marcador clicados). Un <select> no avisa de eso: al abrirlo
  // se deja sin opción, y si se cierra sin elegir, vuelve la que había
  let areaAntes = null;
  $('selArea').addEventListener('pointerdown', () => {
    if ($('selArea').selectedIndex < 0) return;
    areaAntes = $('selArea').value;
    $('selArea').selectedIndex = -1;
  });
  $('selArea').addEventListener('blur', () => {
    if ($('selArea').selectedIndex < 0 && areaAntes !== null) $('selArea').value = areaAntes;
    areaAntes = null;
  });
  window.addEventListener('resize', () => columnasParrilla(soloEventos));
}

function deUrl(){
  // parámetros de la url: a área (selector de área: Asia, Europe... o * todas), b tipo (selector
  // de tipo: evt, mil, aca, peo, lis...), c list (list / grid), d map (on / off: solo cuenta en
  // los tipos que usan el mapa; en los demás no hay panel y el botón está deshabilitado). Los controles empiezan
  // con ellos; sin parámetros: Asia, evt, grid y el mapa abierto.
  // Ej.: wwt.htm?a=Europe&b=mil&c=list&d=off
  const q = new URLSearchParams(location.search);
  if (q.get('a')) $('selArea').dataset.inicial = q.get('a');
  if (q.get('b')) $('selRol').dataset.inicial = q.get('b');
  if (q.has('c')) enListado = /^(list|1|on|si)$/i.test(q.get('c'));
  if (q.has('d')) mapaAbierto = !/^(off|0|no)$/i.test(q.get('d'));
}

function arranca(){
  // punto de entrada: controles (con los parámetros de la url) y personas
  deUrl();
  conecta();
  // privatePeople.out.js es solo local: si falta, salen solo las públicas
  cargaFilas([...(typeof publicPeople == 'undefined' ? [] : publicPeople),
              ...(typeof privatePeople == 'undefined' ? [] : privatePeople)]);
}

arranca();
</script>
