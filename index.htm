<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WWT</title>
<!-- Todo se lee en su sitio, como index.htm: datajs/aux.js, datajs/*People.out.js y datajs/publicEvent.out.js (los crea import.sh)
     y las fotos de import/src.comun/fotos/foto0,1,2,9/ (fotoid.js lo genera import/fotoid.py). -->
<script src="datajs/aux.js"></script>
<script src="datajs/publicPeople.out.js"></script>
<script src="datajs/publicEvent.out.js"></script>
<script src="datajs/fotoid.js"></script>
<script src="datajs/ciudades.js"></script>   <!-- coordenadas de las ciudades (import/coords.py), para el mapa -->
<script src="datajs/paises.js"></script>     <!-- polígonos de los países (import/paises_geo.py), para el mapa -->
<!-- mapa: Leaflet 1.9.4 (aquí, en leaflet/: sin depender de un CDN, que Brave puede bloquear en
     una página local) con teselas de Esri (gratis, sin clave, con su atribución) -->
<link rel="stylesheet" href="leaflet/leaflet.css">
<script src="leaflet/leaflet.js"></script>
<style>
  :root { color-scheme: dark;
          --fondo: #222; --barra: #444; --tarjeta: #3a3a3a; --sinfoto: #474747;
          --texto: #eee; --suave: #999; --enlace: #8ab4f8; --borde: #555;
          --acento: #ffd8b0; }   /* naranja muy claro: marcadores, fecha elegida y fila abierta del listado */
  html { overflow-y: scroll; }   /* la barra de scroll, siempre: los paneles no se mueven al cambiar el tipo (con o sin scroll) */
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: var(--fondo); color: var(--texto); }
  a { color: var(--enlace); }
  /* mapa teñido de azul oscuro: las teselas de Esri son grises e imágenes ya pintadas, así
     que se tiñen con un filtro (sepia da color al gris; hue-rotate lo lleva al azul) */
  .teselaBase { filter: sepia(1) hue-rotate(180deg) saturate(3) brightness(.85); }
  .teselaNombres { filter: sepia(.6) hue-rotate(180deg) saturate(1.5); }
  #mapa.leaflet-container { background: #0d1b2a; }
  /* créditos del mapa: cortos y discretos (los completos, en la ficha de info) */
  #mapa .leaflet-control-attribution { background: transparent; color: #8899aa; font-size: 9px; }
  #mapa .leaflet-control-attribution a { color: inherit; }
  .creditos { font-size: .8em; color: var(--suave); }
  /* + y - del zoom, en el color de acento (--acento) */
  #mapa .leaflet-control-zoom { border: 1px solid var(--acento); }
  #mapa .leaflet-control-zoom a { background: var(--acento); color: #000; border-bottom-color: #0003;
                                 width: 20px; height: 20px; line-height: 20px; font-size: 15px; }   /* más pequeños (Leaflet: 30px) */
  #mapa .leaflet-control-zoom a:hover { background: #ffc890; }
  #mapa .leaflet-control-zoom a.leaflet-disabled { background: var(--acento); color: #0006; }   /* lo que se ve mientras cargan las teselas */
  .cuerpo a { text-decoration: none; font-weight: 600; }   /* enlaces de la ficha: perfil, video... */
  .cuerpo a:hover { color: var(--texto); }
  .cuerpo p.enlaces { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
  .cuerpo p.enlaces a { display: inline-flex; align-items: center; gap: 5px; }
  .cuerpo .icono { height: 16px; width: auto; }
  .filtros { display: flex; justify-content: center; margin: -16px -16px 16px; padding: 12px 16px;   /* el fondo, a todo el ancho */
             position: sticky; top: 0; z-index: 2; background: var(--barra); box-shadow: 0 1px 6px rgba(0,0,0,.6); }
  select { font-size: 1em; padding: 4px 6px; background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); border-radius: 4px; }
  #buscar { font-size: 1em; padding: 4px 6px; width: 100%; box-sizing: border-box;   /* buscador: todo el hueco de .busca */
             background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); border-radius: 4px; }
  #info { display: flex; }
  .cuerpo.encontrado { outline: 2px solid var(--enlace); }   /* ficha buscada, en el listado */
  .busca { position: relative; flex: 1 1 8.5em; min-width: 8.5em; }   /* 2em menos (antes 10.5em): sitio para el botón map */
  #selArea, #selRol { width: 9.5em; box-sizing: border-box; }   /* ancho fijo: no cambia con las opciones ni las cuentas (el texto largo se corta) */
  #sugs { position: absolute; left: 0; top: 100%; margin-top: 4px; width: min(28em, 90vw); z-index: 2;   /* hasta 10 sugerencias */
          background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.6);
          max-height: calc(10 * 26px); overflow-y: auto; }   /* 10 líneas a la vista; el resto, desplazando */
  #sugs div { height: 26px; line-height: 26px; padding: 0 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sugs div.activa, #sugs div:hover { background: var(--barra); }
  #sugs small { color: var(--suave); }
  #sugs .tipo { display: inline-block; width: 3.2em; margin-right: 6px; font-size: .75em; font-weight: 600;   /* tipo: EVT, ORG... */
                text-align: center; color: var(--suave); border: 1px solid var(--borde); border-radius: 3px; line-height: 1.5; }
  /* área, país y ciudad: amarillo claro, más amarillo cuanto más concreto */
  #sugs .tipo.geoARE { background: #fffbe8; border-color: #fffbe8; color: #333; }
  #sugs .tipo.geoCON { background: #fff3b8; border-color: #fff3b8; color: #333; }
  #sugs .tipo.geoCIT { background: #ffe680; border-color: #ffe680; color: #333; }
  #info img { width: 22px; height: 22px; opacity: .8; }
  #info:hover img { opacity: 1; }
  /* parrilla: de 4 a 8 imágenes por fila (--cols, columnasParrilla) y la última fila, centrada */
  .parrilla { --cols: 8; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; align-items: stretch; }
  .parrilla .cara { flex: 0 0 calc((100% - (var(--cols) - 1) * 6px) / var(--cols)); }
  .cara { position: relative; margin: 0; background: #000; display: flex; flex-direction: column;   /* negro bajo la foto y el nombre */
           border-radius: 6px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .cara img, .sinfoto { display: block; flex: none; width: 100%; aspect-ratio: 1; object-fit: contain; background: #000; }   /* foto entera sobre negro */
  .cara img.sinfoto, .cuerpo > img.sinfoto { background: var(--sinfoto); }   /* imagen dummy (img/sinfoto.svg) sobre gris */
  /* evento: portada (foto2/) 16:9 (como revisar), recortada al hueco. Mezclado con personas
     (all), ocupa el sitio de dos; solo eventos (.evts), cada uno es una imagen de la fila */
  .parrilla:not(.evts) .cara.evt { flex-basis: calc(2 * (100% - (var(--cols) - 1) * 6px) / var(--cols) + 6px); }
  .cara.evt img, .cara.evt .sinfoto { aspect-ratio: 16 / 9; object-fit: cover; }
  /* logo (list de hoy-milonga, faitango...): entero, sobre blanco y con margen */
  .cara.evt img.logo, .cuerpo > img.logo { object-fit: contain; background: #fff; padding: 6%; box-sizing: border-box; }
  /* ficha de evento: la portada tan alta como el texto de al lado (align-self: stretch) y el ancho
     que da 16:9; recortada al hueco. Sin bajar de 90 px de alto ni pasar de la mitad de la ficha */
  .cuerpo > img.portada { flex: none; align-self: stretch; width: auto; height: auto; min-height: 90px;
                           max-width: 50%; aspect-ratio: 16 / 9; object-fit: cover; contain: size; }
  /* pie: siempre dos líneas de alto (todas las fichas iguales), el texto centrado en vertical y,
     si no cabe, cortado con … */
  .cara figcaption { flex: none; height: calc(2.5em + 6px); box-sizing: border-box; padding: 3px; background: var(--barra); color: var(--texto);
                     font-size: .7em; line-height: 1.25; display: flex; align-items: center; justify-content: center;
                     text-align: center; overflow-wrap: anywhere; }
  .cara figcaption span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .yt { position: absolute; top: 3px; right: 3px; display: flex; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .yt img { width: 20px; height: 14px; }
  .cara img, .sinfoto, .cara figcaption { cursor: pointer; }   /* la imagen y el pie abren la ficha */
  dialog { border: 1px solid var(--borde); border-radius: 8px; padding: 16px; width: min(520px, 90vw);
           background: var(--barra); color: var(--texto); box-shadow: 0 4px 24px rgba(0,0,0,.8); }
  dialog { margin-top: 56px; }   /* fichas arriba, bajo la barra */
  dialog::backdrop { background: rgba(0,0,0,.7); }
  .cuerpo { display: flex; gap: 14px; align-items: flex-start; }
  /* ficha de persona: la foto, cuadrada, tan alta como la ficha (el texto de al lado); recortada al
     hueco. Sin bajar de 90 px ni pasar de la mitad de la ficha */
  .cuerpo > img, .cuerpo > .sinfoto { flex: none; align-self: stretch; width: auto; height: auto; min-height: 90px;
                                        max-width: 50%; aspect-ratio: 1; object-fit: cover; border-radius: 6px;
                                        contain: size; }   /* su tamaño no cuenta: el alto lo da el texto */
  .cuerpo > img { background: #000; }
  .texto { flex: 1; min-width: 0; }
  dialog .texto { padding-right: 28px; }   /* sitio para la × de cerrar */
  .cuerpo h2 { margin: 0 0 8px; font-size: 1.1em; }
  .cuerpo p { margin: 6px 0; font-size: .9em; overflow-wrap: anywhere; }
  /* listado: las mismas fichas, una debajo de otra */
  .listado { display: flex; flex-direction: column; gap: 8px; width: var(--anchoCab, 640px); max-width: 100%; box-sizing: border-box; margin: 0 auto; }   /* del ancho de la cabecera (línea 1, mapa y meses), como la ficha de detalle */
  .listado .cuerpo { padding: 12px; background: var(--barra); border: 1px solid var(--borde); border-radius: 8px; }
  .listado .cuerpo > img, .listado .cuerpo > .sinfoto { aspect-ratio: 16 / 9; }   /* en el listado, todas 16:9 (también las de persona) */
  /* panel de fechas (eventos): año, YEAR, meses, año siguiente; el botón con el foco, resaltado */
  /* la parte fija: las líneas una debajo de otra, centradas; el ancho, el de la más larga
     (sin pasar del de la ventana: los meses, entonces, se desplazan de lado) */
  .cabecera { display: flex; flex-direction: column; gap: 12px; width: 41em; max-width: 100%; min-width: 0; }   /* ancho fijo (el de los meses): no cambia con el tipo, las cuentas ni las fuentes; los meses lo llenan o se desplazan */
  .linea1 { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; justify-content: center; }
  /* con el panel de fechas, la primera línea no marca el ancho (width 0 + min-width 100%): toma el
     de la cabecera, el de los meses (y el mapa); el buscador y los selectores se estrechan para caber */
  .cabecera:has(#fechas:not(.oculto)) .linea1 { width: 0; min-width: 100%; flex-wrap: nowrap; }
  .cabecera:has(#fechas:not(.oculto)) .linea1 > label { flex: 0 1 9.5em; min-width: 4.5em; }   /* ancho fijo; solo se estrechan si no caben (móvil) */
  .cabecera:has(#fechas:not(.oculto)) .linea1 select { width: 100%; }
  .cabecera:has(#fechas:not(.oculto)) .busca { flex-basis: 5em; min-width: 5em; }
  .fechas { display: flex; gap: 4px; align-items: stretch; justify-content: center; min-width: 0; }
  /* tipos sin fechas: el panel sigue ahí (invisible, sin alto ni el gap de la cabecera) para que
     la cabecera y los paneles midan lo mismo que con event */
  .fechas.sinFechas { visibility: hidden; height: 0; overflow: hidden; margin-top: -12px; }
  #fBotones { display: flex; min-width: 0; overflow-x: auto; scrollbar-width: thin; }   /* los botones, juntos; si no caben, con barra fina */
  .fechas button, #bMapa, #bListado { flex: none; font-size: .85em; padding: 3px 7px; white-space: nowrap; cursor: pointer;
                   background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); border-radius: 4px; }
  #fBotones button { border-radius: 0; margin-left: -1px; }   /* juntos: borde compartido, redondeados solo los extremos */
  #fBotones button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  #fBotones button:last-child { border-radius: 0 4px 4px 0; }
  #fBotones button { display: flex; flex-direction: column; align-items: center; line-height: 1.25; padding: 4px 7px; }   /* dos líneas: nombre y cuántos */
  /* los meses, hasta el ancho del panel del mapa (el de la cabecera): la fila ocupa todo y
     cada botón crece por igual a partir de su ancho */
  #fBotones { flex: 1 1 auto; }
  #fBotones button { flex: 1 0 auto; }
  #fBotones button small { font-size: .85em; color: var(--suave); }
  #fBotones button.vacio { cursor: default; }   /* mes sin eventos: no se puede elegir */
  #fBotones button.activo small { color: #333; }
  .fechas button.activo { background: var(--acento); border-color: var(--acento); color: #000; position: relative; }
  /* listado: cada ficha, una línea (nombre - lugar); el click abre el detalle (la ficha del diálogo) */
  .listado .cuerpo.linea { padding: 6px 12px; cursor: pointer; }   /* 4px menos de alto (antes 8px arriba y abajo) */
  .listado .linea h2 { flex: 1; min-width: 0; margin: 0; font-size: 1em; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .listado .linea:hover { border-color: var(--enlace); }
  /* listado en filas (ESTILO_LISTADO 'filas'): sin tarjetas, una fila por ficha separada por una línea
     fina; tres columnas alineadas (subgrid): fecha suave, nombre, lugar suave a la derecha */
  .listado.filas { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 0; border-top: 1px solid var(--borde); }
  .listado .fila { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; column-gap: 16px; align-items: baseline;
                   padding: 7px 10px; border-bottom: 1px solid var(--borde); border-left: 2px solid transparent; cursor: pointer; }
  .listado .fila:hover { background: rgba(255, 255, 255, .04); }
  .listado .fila.abierta { background: var(--acento); color: #000; }   /* la de la ficha abierta: el color de la fecha elegida (--acento) */
  .listado .fila.abierta .fFecha, .listado .fila.abierta .fLugar { color: #5c4a38; }
  .listado .fila.encontrado { outline: 0; border-left-color: var(--enlace); }   /* la buscada */
  .fila span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fila .fFecha, .fila .fLugar { color: var(--suave); font-size: .85em; font-variant-numeric: tabular-nums; }
  .fila .fNombre { font-weight: 500; }
  .fila .fLugar { text-align: right; max-width: 18em; }
  .fila .fIconos { display: flex; gap: 6px; align-self: center; justify-content: flex-end; min-width: 38px; }   /* globo y user, si los tiene; sitio para los dos y, si hay uno, a la derecha */
  .fila .fIconos img { height: 16px; width: 16px; display: block; }
  @media (max-width: 600px) {   /* el lugar, debajo del nombre */
    .listado.filas { grid-template-columns: auto minmax(0, 1fr) auto; }
    .fila .fLugar { grid-column: 2; text-align: left; max-width: none; }
    .fila .fIconos { grid-column: 3; grid-row: 1; }
  }
  /* panel del mapa, bajo la barra (tras el de fechas). z-index 0: las capas de Leaflet no tapan la barra fija */
  .mapaCaja { position: relative; z-index: 0; }   /* del ancho de la cabecera */
  .mapaCaja.cerrado { display: none; }             /* cerrado: nada (el botón map está en la primera línea) */
  .mapa { height: 224px; max-height: 32vh; border: 1px solid var(--borde); border-radius: 6px; }   /* fijo arriba: que deje sitio al listado */
  #bMapa:disabled { opacity: .45; cursor: default; }   /* tipo sin mapa */
  .linea1 #bMapa, .linea1 #bListado { font-size: 1em; padding: 4px 6px; width: 4.8em; box-sizing: border-box; text-align: center; }   /* en la primera línea, del alto de los selectores; los dos, del mismo ancho */
  .iParrilla { position: relative; top: -2px; }   /* el icono de parrilla (▦), 2px más arriba: alineado con el texto */
  @media (max-width: 600px) { .mapa { height: 160px; } }
  .aviso { color: var(--suave); }
  .oculto { display: none !important; }   /* !important: gana a los display de .listado.filas y demás (si no, el listado seguía bajo la parrilla) */
  #fCerrar { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: var(--suave); font-size: 1.3em; cursor: pointer; }
  #fCerrar:hover { color: var(--texto); }
  /* detalle: la ficha abierta (click en la parrilla, el listado o el mapa), bajo el mapa */
  .detalle { position: relative; width: var(--anchoCab, 640px); max-width: 100%; box-sizing: border-box; margin: 0 auto 16px; padding: 16px; background: var(--barra);   /* del ancho del listado */
             border: 1px solid var(--borde); border-radius: 8px; }
  /* fija bajo la barra (--altoBarra, lo que mide .filtros) a los 16px del margen de la barra: donde se
     abre, sin moverse al hacer scroll; la parrilla o el listado se desplazan por debajo. Las sombras,
     del color del fondo, tapan los huecos de arriba y de abajo para que no se vean pasar las fichas */
  .detalle { position: sticky; top: calc(var(--altoBarra, 0px) + 16px); z-index: 1; max-height: 60vh; overflow-y: auto;
             box-shadow: 0 -16px 0 var(--fondo), 0 16px 0 var(--fondo); }
  .detalle .texto { padding-right: 28px; }   /* sitio para la × de cerrar */
  #dCerrar { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: var(--acento); font-size: 1.3em; font-weight: 700; cursor: pointer; }   /* la × gruesa, del color de la fila abierta del listado */
  #dCerrar:hover { color: #ffc890; }   /* como el hover del zoom */
  /* detalle con ESTILO_LISTADO 'filas': como su fila del listado, sin tarjeta; líneas finas arriba y
     abajo, el nombre en 500 y lugar y fecha en tono suave */
  .detalle.filas { background: var(--fondo); border: 0; border-radius: 0; border-top: 1px solid var(--borde);
                   border-bottom: 1px solid var(--borde); padding: 14px 10px; }
  .detalle.filas h2 { font-weight: 500; font-size: 1.05em; }
  .detalle.filas h2 .hLugar { color: var(--suave); font-size: .8em; font-weight: 400; margin-left: 10px; }
  .detalle.filas p { color: var(--suave); }
  .detalle.filas p.fFecha { font-variant-numeric: tabular-nums; margin-top: 0; }
  .detalle.filas .cuerpo a { font-weight: 500; }
  .detalle.filas .cuerpo > img { border-radius: 3px; }
</style>
</head>
<body>
<div class="filtros">
 <div class="cabecera">   <!-- la parte fija, centrada: tan ancha como su línea más larga -->
  <div class="linea1">   <!-- primera línea: info, buscador, selectores, list y map -->
    <a id="info" href="#" title="KoKo Tango"><img src="img/koko.svg" alt="KoKo Tango"></a>
    <span class="busca"><input id="buscar" type="search" placeholder="search" autocomplete="off"><div id="sugs" class="oculto"></div></span>
    <label><select id="selArea" data-inicial="Asia"></select></label>
    <label><select id="selRol" data-inicial="evt"></select></label>
    <button id="bListado" title="grid / list">list</button>
    <button id="bMapa" title="show / hide the map">map</button>
  </div>
  <div id="mapaCaja" class="mapaCaja oculto">   <!-- segunda línea, el panel del mapa, del ancho de las líneas: lo que sale abajo, por lugar (el botón map, en la primera línea) -->
    <div id="mapa" class="mapa"></div>
  </div>
  <div id="mapaAviso" class="aviso oculto"></div>   <!-- si el mapa falla, por qué -->
  <div id="fechas" class="fechas oculto">   <!-- tercera línea, el panel de fechas: solo con los roles de eventos -->
    <div id="fBotones"></div>
  </div>
 </div>
</div>
<div id="detalle" class="detalle oculto"><button id="dCerrar" title="close">&times;</button><div id="dCuerpo" class="cuerpo"></div></div>
<div id="parrilla" class="parrilla"></div>
<div id="listado" class="listado oculto"></div>
<dialog id="ficha"><button id="fCerrar" title="close">&times;</button><div id="fCuerpo" class="cuerpo"></div></dialog>

<script>
const FOTOS = 'foto';      // + carpeta (0 a mano, 1 perfil, 2 portada, 9 dudosas) + '/'
const TODOS = '*';
const ESTILO_LISTADO = 'filas';               // listado: 'filas' (tres columnas, sin tarjetas) o 'lineas' (tarjetas: fecha - nombre - lugar)
const EVT = 'evt';                           // opción del selector de rol: eventos (publicEvent), no personas
const SEM = 'sem';                           // opción del selector de rol: seminarios (eventos de tipo seminar), aparte de evt
const ACA = 'aca';                           // opción del selector de rol: academias (tipo academy, sin fecha; su local, loc: -> un venue), aparte de evt
const MIL = 'mil';                           // opción del selector de rol: milongas (tipo milonga, regulares: REG; su local, loc: -> un venue)
const deEventos = r => r == EVT || r == SEM || r == ACA || r == MIL;  // opciones del selector que son eventos
const sinFecha = r => r == ACA || r == MIL;                           // sin fecha EVT: ni panel de fechas ni filtro
const rolEvento = t => String(t).indexOf('seminar') != -1 ? SEM : String(t).indexOf('academy') != -1 ? ACA
                     : String(t).split(' ')[0] == 'milonga' ? MIL : EVT;
const PEO = 'peo';                           // opción del selector de rol: todas las personas (sin eventos)
const LIS = 'lis';                           // opción del selector de rol: list (fuentes de información, tipo list de publicEvent)
const MUNDIAL = 'World';                     // área de las list mundiales (país world, ciudad *world): salen en todas las áreas
const $ = id => document.getElementById(id);

// Foto (ruta) por el id del campo 9 (CAMPO.idfoto, "-" sin foto): la primera
// que haya en import/src.comun/fotos/foto0,1,2,9 (eventos 0,2,1,9: la portada antes), como index.htm
function foto(idfoto, evento){
  const f = fotoDeId(idfoto, evento);    // aux.js
  return f ? FOTOS + f.carpeta + '/' + f.fichero : '';
}

// posición en el mapa [lat, lon] de una fila: su lat/lon (varios) o, sin ellos,
// el centro de su ciudad (CIUDADES_COORD de datajs/ciudades.js); null si no hay
const coordCiudad = r => (typeof CIUDADES_COORD == 'undefined' ? null
                          : CIUDADES_COORD[String(r[CAMPO.country]).trim() + '|' + String(r[CAMPO.city]).trim()]) || null;
function coordDe(r){
  const v = leeVarios(r), la = parseFloat((v.lat || [])[0]), lo = parseFloat((v.lon || [])[0]);
  return !isNaN(la) && !isNaN(lo) ? [la, lo] : coordCiudad(r);
}
// venue de un evento o una academia con loc (una academia, como una milonga, enlaza a su
// local): el de su ciudad que se llama igual; null si no tiene
let _venues = null;
function venueDe(e){
  const loc = (leeVarios(e).loc || [])[0];
  if (!loc) return null;
  _venues = _venues || new Map((typeof publicEvent == 'undefined' ? [] : publicEvent).filter(x => x[CAMPO.tiporol] == 'venue')
                                 .map(x => [x[CAMPO.country] + '|' + x[CAMPO.city] + '|' + x[CAMPO.name], x]));
  return _venues.get(e[CAMPO.country] + '|' + e[CAMPO.city] + '|' + loc) || null;
}
// posición de un evento o una academia: la suya o la de su venue (donde va la ubicación)
function posEvento(e){
  const v = leeVarios(e), la = parseFloat((v.lat || [])[0]), lo = parseFloat((v.lon || [])[0]);
  if (!isNaN(la) && !isNaN(lo)) return [la, lo];
  const venue = venueDe(e);
  return venue ? coordDe(venue) : coordCiudad(e);
}
// foto de un evento o una academia: la suya o, sin ella, la de su venue
function fotoEvento(e){
  const venue = venueDe(e);
  return foto(e[CAMPO.idfoto], true) || (venue ? foto(venue[CAMPO.idfoto], true) : '');
}

// Filas: [area, pais, ciudad, roles, nombre, públicos (#), comentario privado, url, idfoto].
// Una persona por foto (o, sin foto, por url de perfil o por nombre): las filas
// repetidas suman roles y completan área, vídeo y foto.
let personas = [];
function cargaFilas(filas){
  const porClave = new Map();
  for (const c of filas){
    const f = foto(c[CAMPO.idfoto], false);
    const url = c[CAMPO.urlfb] && c[CAMPO.urlfb] != '-' ? c[CAMPO.urlfb] : '';
    const clave = f || url || 'nombre:' + c[CAMPO.name];
    // campo 6 (leeVarios de aux.js): txt -> coment; www y vid -> notas, a la
    // línea de enlaces; campo 7: comentario privado (solo en privatePeople)
    const v = leeVarios(c);
    const coments = [...(v.txt || []), ...(v.ins || []).map(u => 'Instagram @' + u), ...(v.wec || []).map(w => 'WeChat ' + w),
                     ...(v.kak || []).map(k => 'Kakao ' + k), ...(v.tel || []).map(t => '☎ ' + t), ...(v.ema || [])];
    const notas = [...(v.vid || []), ...(v.www || []), String(c[CAMPO.private] || '').trim()].filter(x => x && x != '-').join(',');
    const fb = /facebook\.com\//.test(url) ? url : '';
    const area  = c[CAMPO.area] && c[CAMPO.area] != '-' ? c[CAMPO.area] : '-';
    const pais  = c[CAMPO.country] && c[CAMPO.country] != '-' ? c[CAMPO.country] : '-';
    const lugar = [c[CAMPO.city], c[CAMPO.country]].filter(x => x && x != '-').join(', ');   // "ciudad, país" (para el listado)
    const ciudad = c[CAMPO.city] && c[CAMPO.city] != '-' ? String(c[CAMPO.city]).trim() : '';
    const roles = String(c[CAMPO.tiporol] || '').split(',').map(r => r.trim()).map(r => ROLES_EQUIVALENCIAS[r] || r).filter(r => ROLES[r]);
    const video = (v.vid || [''])[0];
    const p = porClave.get(clave);
    const pos = coordDe(c);
    if (!p){ porClave.set(clave, {area, pais, lugar, ciudad, pos, roles, nombre: c[CAMPO.name], video, foto: f, fb, notas: notas ? [notas] : [],
                                     coment: coments}); continue; }
    if (!p.pos) p.pos = pos;
    if (!p.fb) p.fb = fb;
    for (const t of coments) if (!p.coment.includes(t)) p.coment.push(t);
    if (notas && !p.notas.some(n => n.includes(notas))){
      p.notas = p.notas.filter(n => !notas.includes(n));   // una nota contenida en otra no se repite
      p.notas.push(notas);
    }
    if (p.area == '-') p.area = area;
    if (p.pais == '-') p.pais = pais;
    if (!p.lugar) p.lugar = lugar;
    if (!p.ciudad) p.ciudad = ciudad;
    if (!p.video) p.video = video;
    for (const r of roles) if (!p.roles.includes(r)) p.roles.push(r);
  }
  personas = [...porClave.values(), ...eventos(), ...listas()];
  personas.forEach((p, i) => p.id = i);
  fotosDeLista(porClave);
  sugerencias();
  pinta();
}

// Eventos (opción evt): las filas de publicEvent.out.js de tipo event*, una por
// evento: se juntan las de la misma url o www (sin http, www, mayúsculas ni / final) y
// día de inicio (±1 día), o del mismo nombre (solo letras y números) y día de inicio (±1); la que se queda completa con
// la otra foto, url y organizadores. Los de tipo seminar van a la opción sem, no a evt
// (como esSeminar de index.htm). Fecha EVT.<mes>.<MES>.<días>.<año> -> '2027.FEB.4-8'.
const claveNom = (n, f) => String(n).toLowerCase().replace(/[^\p{L}\p{N}]/gu, '') + '#' + f;
// día de inicio de EVT.<mes>.<MES>.<días>.<año> como nº de día (el día de fin no cuenta); null sin fecha EVT
// varios (campo 6, leeVarios de aux.js): los org y la primera www (web que no es de Facebook)
const orgsDe = e => leeVarios(e).org || [];
const wwwDe = e => (leeVarios(e).www || [''])[0];
const inicio = d => {
  const f = String(d || '').split('.'), dia = parseInt(String(f[3] || '').split('-')[0]), mes = parseInt(f[1]), anyo = parseInt(f[4]);
  return f[0] == 'EVT' && !isNaN(dia + mes + anyo) ? Math.round(Date.UTC(anyo, mes, dia) / 864e5) : null;
};
// próximo día (Date, desde hoy, hoy incluido) de una fecha regular REG (leeReg de aux.js):
// diaria, hoy; semanal, el primero de sus días; mensual, la primera de sus semanas
// (L: la última) de este mes o del siguiente; null sin día fijo (?) o sin REG
function proximaReg(f){
  const r = leeReg(f), hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  if (!r || !r.dias.length) return null;
  if (r.frec != 'M'){
    const k = Math.min(...r.dias.map(d => (d - hoy.getDay() + 7) % 7));
    return new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + k);
  }
  const fechas = [0, 1].flatMap(m => r.semanas.map(s => {
    const primero = new Date(hoy.getFullYear(), hoy.getMonth() + m, 1);
    const dia1 = 1 + (r.dias[0] - primero.getDay() + 7) % 7;   // el primero de ese día de la semana
    const ult = new Date(primero.getFullYear(), primero.getMonth() + 1, 0).getDate();
    const dia = s == 'L' ? dia1 + 7 * Math.floor((ult - dia1) / 7) : dia1 + 7 * (s - 1);
    return dia <= ult ? new Date(primero.getFullYear(), primero.getMonth(), dia) : null;   // 5ª semana: no todos los meses
  }));
  return fechas.filter(d => d && d >= hoy).sort((a, b) => a - b)[0] || null;
}
// enlace a Google Maps de un evento: busca el nombre de su local, su dirección y, al final, ciudad y país
// (los que no estén ya en la dirección); sin nada de eso, su lat/lon (los suyos o los de su venue).
// Con api=1 Google Maps hace la búsqueda al abrir (la forma /maps/search/<texto>/@lat,lon solo la escribe)
function mapaDe(e){
  const venue = venueDe(e), v = leeVarios(e), vv = venue ? leeVarios(venue) : {};
  const dir = (v.dir || vv.dir || [''])[0];
  const lugar = [e[CAMPO.city], e[CAMPO.country]].map(x => String(x || '').trim())
                .filter(x => x && x != '-' && !dir.toLowerCase().includes(x.toLowerCase()));
  // sin trozos repetidos (el local suele ir también al principio de la dirección)
  const trozos = [(v.loc || [''])[0], dir, ...lugar].join(', ').split(',').map(x => x.trim()).filter(Boolean);
  const texto = trozos.filter((x, i) => trozos.findIndex(y => y.toLowerCase() == x.toLowerCase()) == i).join(', ');
  const la = parseFloat((v.lat || vv.lat || [])[0]), lo = parseFloat((v.lon || vv.lon || [])[0]);
  const conPos = !isNaN(la) && !isNaN(lo);
  const q = texto || (conPos ? la + ',' + lo : '');
  return q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q) : '';
}
function eventos(){
  const porClave = new Map(), lista = [];
  for (const e of (typeof publicEvent == 'undefined' ? [] : publicEvent)){
    if (!String(e[CAMPO.tiporol]).startsWith('event') && !sinFecha(rolEvento(e[CAMPO.tiporol]))) continue;   // eventos, academias y milongas
    const url = /^https?:\/\//.test(e[CAMPO.urlfb] || '') ? e[CAMPO.urlfb] : '';
    // misma url y día de inicio (una web puede llevar varios eventos), o mismo nombre y
    // día de inicio (solo con fecha); el día de inicio, con ±1 día de margen
    const n = inicio(fechaDe(e));
    const claves = d => [...[url, wwwDe(e)].filter(Boolean).map(u => 'u:' + claveUrl(u) + '#' + (n == null ? fechaDe(e) : n + d)), n != null && 'n:' + claveNom(e[CAMPO.name], n + d)].filter(Boolean);
    const ya = [0, -1, 1].flatMap(d => n == null && d ? [] : claves(d)).map(k => porClave.get(k)).find(Boolean);
    if (ya){
      // repetido: completa lo que le falte
      if (!ya.fb && url) ya.fb = url;
      if (!ya.foto) ya.foto = fotoEvento(e);
      if (!ya.pos) ya.pos = posEvento(e);
      const orgs = orgsDe(e);
      for (const o of orgs) if (!ya.orgs.includes(o)) ya.orgs.push(o);
      if (wwwDe(e) && !ya.www.includes(wwwDe(e))) ya.www.push(wwwDe(e));
      if (!ya.video) ya.video = (leeVarios(e).vid || [''])[0];
      for (const k of claves(0)) if (!porClave.has(k)) porClave.set(k, ya);
      continue;
    }
    const f = fechaDe(e).split('.');
    // milonga regular (REG): su próximo día (proximaReg) como fecha, y lo regular aparte ('wed 1930-2400'); sin próximo día, sin fecha (el listado pone '?')
    const prox = f[0] == 'REG' ? proximaReg(fechaDe(e)) : null;
    const fecha = f[0] == 'EVT' ? [f[4], f[2], f[3]].filter(Boolean).join('.')
                : prox ? [prox.getFullYear(), MESES[prox.getMonth()], prox.getDate()].join('.') : '';
    const reg = f[0] == 'REG' ? textoReg(fechaDe(e)) : '';   // lo regular, para la ficha (también sin próximo día)
    const orden = f[0] == 'EVT' ? (parseInt(f[4]) || 9999) * 100 + (parseInt(f[1]) || 0) : prox ? prox.getFullYear() * 100 + prox.getMonth() : 999999;
    const mes = f[0] == 'EVT' ? parseInt(f[1]) : prox ? prox.getMonth() : NaN, dia = prox ? prox.getDate() : parseInt(f[3]) || 1;   // día sin fijar ('?'): el 1
    const orgs = orgsDe(e);
    const ev = {evento: true, area: e[CAMPO.area] && e[CAMPO.area] != '-' ? e[CAMPO.area] : '-', pais: e[CAMPO.country] && e[CAMPO.country] != '-' ? e[CAMPO.country] : '-', roles: [rolEvento(e[CAMPO.tiporol])], nombre: e[CAMPO.name], foto: fotoEvento(e),
                         fb: url, tipo: String(e[CAMPO.tiporol]).replace(/^event\s*/, '') || 'event', pos: posEvento(e),
                         ciudad: e[CAMPO.city] && e[CAMPO.city] != '-' ? String(e[CAMPO.city]).trim() : '',
                         lugar: [(leeVarios(e).loc || [])[0], e[CAMPO.city], e[CAMPO.country]].filter(x => x && x != '-').join(', '),   // con su local (milonga, academia)
                         sala: (leeVarios(e).loc || [''])[0], fecha, reg, orden,
                         mapa: rolEvento(e[CAMPO.tiporol]) == MIL ? mapaDe(e) : '', mes, dia, orgs, www: wwwDe(e) ? [wwwDe(e)] : [],
                         video: (leeVarios(e).vid || [''])[0], notas: [], coment: []};   // vídeo: el play en la parrilla y la ficha
    for (const k of claves(0)) porClave.set(k, ev);
    lista.push(ev);
  }
  return lista;
}

// Fotos de las list. Con el usuario entre paréntesis al final del nombre ("... (Beto Kim)"): la foto del
// perfil de esa persona, antes que la suya (su nombre, igual o seguido de " (...)": "Beto Kim (땅고지기)")
// logos de los sitios de las list sin foto: hoy-milonga (sus páginas piden iniciar sesión:
// no se bajan), faitango, WeChat y tangomarathons (sus páginas no tienen foto; la de
// tangomarathons, su favicon grande)
const LOGOS = [[/hoy-milonga\.com/, 'img/hoymilonga.svg'], [/faitango\.it/, 'img/faitango.png'],
               [/mp\.weixin\.qq\.com/, 'img/wechat.png'], [/tangomarathons\.com/, 'img/tangomarathons.png']];
function fotosDeLista(porClave){
  const conFoto = [...porClave.values()].filter(p => p.foto);
  for (const l of personas.filter(p => p.lista)){
    const autor = (l.nombre.match(/\(([^()]+)\)\s*$/) || [])[1];
    const p = autor && conFoto.find(p => p.nombre == autor || p.nombre.startsWith(autor + ' ('));
    if (p) l.foto = p.foto;
    // sin foto, el logo de su sitio (LOGOS), si lo hay
    const logo = !l.foto && LOGOS.find(([re]) => re.test(l.fb));
    if (logo){ l.foto = logo[1]; l.logo = true; }
  }
}

// List (opción list): las filas de publicEvent.out.js de tipo list; nombre, url, foto (como la portada de un evento)
// y posición (para el mapa, posLista).
// La url, la del campo url o, sin ella, la primera www: de varios (donde la traen las list)
// centro [lat, lon] de un país (PAISES_GEO de datajs/paises.js): el del recuadro de su polígono
// más grande (Francia, sin sus islas lejanas); null si no está
function centroPais(pais){
  if (typeof PAISES_GEO == 'undefined') return null;
  const f = PAISES_GEO.features.find(f => f.properties.nombres.includes(pais));
  if (!f) return null;
  const polis = f.geometry.type == 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  const cajas = polis.map(p => { const xs = p[0].map(c => c[0]), ys = p[0].map(c => c[1]);
                                 return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; });
  const [x0, y0, x1, y1] = cajas.reduce((m, c) => (c[2] - c[0]) * (c[3] - c[1]) > (m[2] - m[0]) * (m[3] - m[1]) ? c : m);
  return [(y0 + y1) / 2, (x0 + x1) / 2];
}
// lugar (para el listado): "ciudad, país"; las de toda un área (ciudad *world, *europe), solo el
// área: World, Europe
const lugarLista = e => deZona(e) ? e[CAMPO.area]
                      : [e[CAMPO.city], e[CAMPO.country]].filter(x => x && x != '-').join(', ');
// las de toda un área (ciudad *world, *europe...): en el mapa, un cuadrado
const deZona = e => String(e[CAMPO.city]).startsWith('*');
// posición en el mapa: la de su ciudad o, sin ella, el centro de su país; las de un
// continente, el centro de su vista (VISTA_AREA); las de World, 0,0
function posLista(e){
  if (e[CAMPO.area] == MUNDIAL) return [0, 0];
  const v = VISTA_AREA[e[CAMPO.area]];
  if (deZona(e) && v) return [(v[0][0] + v[1][0]) / 2, (v[0][1] + v[1][1]) / 2];
  return coordDe(e) || centroPais(e[CAMPO.country]);
}
const urlLista = e => [e[CAMPO.urlfb], ...(leeVarios(e).www || [])].find(u => /^https?:\/\//.test(u || '')) || '';
function listas(){
  return (typeof publicEvent == 'undefined' ? [] : publicEvent).filter(e => e[CAMPO.tiporol] == 'list').map(e => ({
    lista: true, area: e[CAMPO.area] && e[CAMPO.area] != '-' ? e[CAMPO.area] : '-', pais: e[CAMPO.country] && e[CAMPO.country] != '-' ? e[CAMPO.country] : '-', roles: [LIS], nombre: e[CAMPO.name], pos: posLista(e), zona: deZona(e),
    fb: urlLista(e), lugar: lugarLista(e), www: leeVarios(e).www || [],   // www: para el globo del listado
    foto: foto(e[CAMPO.idfoto], true), video: '', notas: [], coment: []}));
}

const enArea = (p, a) => a == TODOS || p.area == a || p.area == MUNDIAL;
const enRol  = (p, r) => r == LIS ? !!p.lista                             // 'list': solo las list
                       : p.lista ? false                                  // las list no salen en las demás
                       : r == TODOS ? true                                 // 'all': personas y eventos
                       : r == PEO ? !p.evento                             // 'people': todas las personas
                       : deEventos(r) ? !!p.evento && p.roles.includes(r)
                       : !p.evento && p.roles.includes(r);

function opciones(sel, valores, etiqueta, cuenta, todos = 'all'){
  // Rellena un selector con "etiqueta (n)"; conserva la opción elegida (al cargar, la de data-inicial).
  // todos: el nombre de la opción de todo (TODOS)
  const actual = sel.value || sel.dataset.inicial || TODOS;
  sel.innerHTML = '';
  // valores: lista de valores o de grupos {grupo, valores} (cada grupo, en su <optgroup>)
  const opcion = (dentro, v) => {
    const o = document.createElement('option');
    o.value = v;
    o.textContent = (v == TODOS ? todos : etiqueta(v)) + (cuenta ? ' (' + cuenta(v) + ')' : '');   // sin cuenta: solo el nombre
    dentro.appendChild(o);
  };
  opcion(sel, TODOS);
  for (const v of valores){
    if (typeof v != 'object'){ opcion(sel, v); continue; }
    const g = document.createElement('optgroup');
    g.label = v.grupo;
    for (const w of v.valores) opcion(g, w);
    sel.appendChild(g);
  }
  sel.value = actual;
  if (sel.selectedIndex < 0) sel.value = TODOS;   // la elegida ya no está (otra área): all
}

function organizadores(){
  // nombre de persona -> eventos que organiza (orgsDe). url: campo 8, o '' sin enlace
  const organiza = new Map();
  for (const e of (typeof publicEvent == 'undefined' ? [] : publicEvent)){
    if (e[CAMPO.tiporol] == 'venue') continue;
    const url = /^https?:\/\//.test(e[CAMPO.urlfb] || '') ? e[CAMPO.urlfb] : '';
    for (const o of orgsDe(e)){
      if (!organiza.has(o)) organiza.set(o, []);
      if (!organiza.get(o).some(x => x.nombre == e[CAMPO.name])) organiza.get(o).push({nombre: e[CAMPO.name], url});
    }
  }
  return organiza;
}
const organiza = organizadores();

// icono de un enlace: el de user (img/perfil.svg) si es de Facebook (y de texto, 'facebook'); si no, el globo
const esFb = u => /^https?:\/\/([a-z]+\.)?(facebook\.com|fb\.com|fb\.me)\//i.test(u);
const iconoUrl = u => esFb(u) ? 'img/perfil.svg' : 'img/web.svg';
function enlace(href, texto, icono){
  // enlace en pestaña nueva; con icono (img/...) delante del texto si se indica
  const a = document.createElement('a');
  a.href = href; a.textContent = texto; a.target = '_blank'; a.rel = 'noopener';
  if (icono){
    const img = document.createElement('img');
    img.src = icono; img.alt = ''; img.className = 'icono';
    a.prepend(img);
  }
  return a;
}

function cara(p){
  // foto o, sin foto, la imagen dummy (img/sinfoto.svg) sobre gris
  const img = document.createElement('img');
  img.src = p.foto || 'img/sinfoto.svg';
  img.alt = p.nombre;
  img.loading = 'lazy';
  if (!p.foto) img.className = 'sinfoto';
  if (p.logo) img.className = 'logo';
  return img;
}

// iconos del listado (a la derecha de la fila): globo con la primera web (no de Facebook) y user con
// el perfil de Facebook (en las personas, su campo fb); cada uno, solo si lo tiene
function iconosFila(p){
  const s = document.createElement('span');
  s.className = 'fIconos';
  const notas = (p.notas || []).join(' ').match(/https?:\/\/[^\s,]+/g) || [];
  const web = [p.fb, ...(p.www || []), ...notas].find(u => u && /^https?:\/\//.test(u) && !esFb(u) && !/youtu/.test(u));
  const user = p.lista || p.evento ? (p.fb && esFb(p.fb) ? p.fb : '') : p.fb;
  for (const [u, icono, t] of [[web, 'img/web.svg', 'web'], [user, 'img/perfil.svg', 'facebook']]){
    if (!u) continue;
    const a = enlace(u, '', icono);
    a.title = t;
    a.onclick = e => e.stopPropagation();   // abre el enlace, no la ficha
    s.appendChild(a);
  }
  return s;
}

// fecha sin el año, para el listado: 'año.MES.días' -> 'MES.días' (la ficha la lleva entera);
// una milonga sin fecha (sin próximo día), '?'
const fechaListado = p => (p.fecha || '').replace(/^\d{4}\./, '') || (p.roles[0] == MIL ? '?' : '');

function titulo(d, p, conLugar, fechaAparte){
  // h2 con el nombre; en el listado y el detalle (conLugar), en los eventos la
  // fecha delante ("fecha - ", salvo fechaAparte: el detalle la pone en la segunda línea)
  // y detrás " - ciudad, país"
  const h = document.createElement('h2');
  if (conLugar && ESTILO_LISTADO == 'filas'){
    // detalle en filas: el nombre y, aparte y en tono suave, el lugar
    h.textContent = p.nombre;
    if (p.lugar){
      const s = document.createElement('span');
      s.className = 'hLugar';
      s.textContent = p.lugar;
      h.appendChild(s);
    }
  } else h.textContent = (conLugar ? [fechaAparte ? '' : fechaListado(p), p.nombre, p.lugar] : [p.nombre]).filter(Boolean).join(' - ');
  d.appendChild(h);
}

function rellenaEvento(c, p, conLugar){
  // Ficha de evento en el contenedor c: portada a la izquierda; nombre, lugar, fechas, quién lo
  // organiza y el enlace, que lleva de texto el tipo (festival, marathon...)
  const img = cara(p);
  if (p.foto) img.className = 'portada';
  c.appendChild(img);
  const d = document.createElement('div');
  d.className = 'texto';
  c.appendChild(d);
  titulo(d, p, conLugar, true);
  const fecha = p.reg ? 'regular ' + p.reg : p.fecha;   // milonga regular: 'regular wed 1930-2400', sin el próximo día (ese, en el listado)
  for (const texto of conLugar ? [fecha] : [p.lugar, fecha]){   // con conLugar (detalle), el lugar ya en el título; la fecha, segunda línea sin negrita
    if (!texto) continue;
    const par = document.createElement('p');
    par.textContent = texto;
    if (conLugar) par.className = 'fFecha';   // en el detalle, solo la fecha
    d.appendChild(par);
  }
  if (p.orgs.length){
    // quién lo organiza, con enlace a su perfil si está entre las personas
    const par = document.createElement('p');
    par.appendChild(document.createTextNode('org: '));
    p.orgs.forEach((nombre, i) => {
      if (i) par.appendChild(document.createTextNode(', '));
      const url = (personas.find(x => !x.evento && x.nombre == nombre && x.fb) || {}).fb;
      par.appendChild(url ? enlace(url, nombre) : document.createTextNode(nombre));
    });
    d.appendChild(par);
  }
  // el tipo (festival, encuentro...): enlace al evento con su icono (iconoUrl: user si es de
  // Facebook, globo si no); de Facebook, el tipo de texto y el enlace 'facebook'; sin url, solo el texto
  const par = document.createElement('p');
  par.className = 'enlaces';
  if (p.fb && esFb(p.fb)) par.append(document.createTextNode(p.tipo), enlace(p.fb, 'facebook', iconoUrl(p.fb)));
  else par.appendChild(p.fb ? enlace(p.fb, p.tipo, iconoUrl(p.fb))
                            : document.createTextNode(p.tipo));
  // www (varios): por su dominio, en la misma línea; el vídeo (YouTube), también
  for (const u of p.www) par.appendChild(enlace(u, u.replace(/^https?:\/\/(www\.)?/, '').split('/')[0], 'img/web.svg'));
  if (p.video) par.appendChild(enlace(p.video, 'video', 'img/yt.svg'));
  if (p.mapa) par.appendChild(enlace(p.mapa, 'map', 'img/mapa.svg'));   // milonga: su local en Google Maps
  d.appendChild(par);
}

function rellenaPersona(c, p, conLugar){
  // Ficha en el contenedor c: foto a la izquierda; a la derecha nombre, campo 6, notas (urls tal cual) y una línea con los enlaces «video» (YouTube) y «perfil» (FB), con icono
  c.appendChild(cara(p));
  const d = document.createElement('div');
  d.className = 'texto';
  c.appendChild(d);
  titulo(d, p, conLugar);
  const eventos = organiza.get(p.nombre) || [];
  if (eventos.length){
    // eventos que organiza (con enlace si el evento tiene url)
    const par = document.createElement('p');
    par.appendChild(document.createTextNode('org: '));
    eventos.forEach((ev, i) => {
      if (i) par.appendChild(document.createTextNode(', '));
      par.appendChild(ev.url ? enlace(ev.url, ev.nombre) : document.createTextNode(ev.nombre));
    });
    d.appendChild(par);
  }
  // campo 6: textos públicos (escuela, milonga...), en una sola línea, los trozos
  // separados por comas y sin repetir
  const coments = [];
  for (const n of p.coment) for (const t of n.split(/,/).map(x => x.trim()))
    if (t && !coments.includes(t)) coments.push(t);
  if (coments.length){
    const par = document.createElement('p');
    par.textContent = coments.join(', ');
    d.appendChild(par);
  }
  // notas (urls del campo 6 y comentario privado del campo 7), en otra línea (info:),
  // los trozos separados por comas; no repite los ya puestos en la línea anterior.
  // Se corta por " / " (texto del perfil de FB) y por "," sin espacio detrás
  // (url,texto). Las urls no salen aquí: van a la línea de enlaces
  const urls = [], textos = [];
  for (const n of p.notas) for (const linea of n.split(/\s+\/\s+|,(?!\s)/)){
    let texto = '';
    for (const trozo of linea.split(/(https?:\/\/[^\s,]+)/)){
      if (/^https?:\/\//.test(trozo)){ if (!urls.includes(trozo)) urls.push(trozo); }
      else texto += trozo;
    }
    texto = texto.replace(/^[\s,]+|[\s,]+$/g, '');
    if (texto && !textos.includes(texto) && !coments.includes(texto)) textos.push(texto);
  }
  if (textos.length){
    const par = document.createElement('p');
    par.textContent = 'prv: ' + textos.join(', ');
    d.appendChild(par);
  }
  // video, otras webs (por su dominio) y perfil en la misma línea
  const enlaces = [...urls.filter(u => /youtu/.test(u)).map(v => enlace(v, 'video', 'img/yt.svg')),
                   ...urls.filter(u => !/youtu/.test(u)).map(u => enlace(u, u.replace(/^https?:\/\/(www\.)?/, '').split('/')[0], 'img/web.svg')),
                   ...(p.fb ? [enlace(p.fb, 'perfil', 'img/perfil.svg')] : [])];
  if (enlaces.length){
    const par = document.createElement('p');
    par.className = 'enlaces';
    for (const e of enlaces) par.appendChild(e);
    d.appendChild(par);
  }
}

function rellenaLista(c, p){
  // list: la imagen a la izquierda (como la portada de un evento), el nombre y la url
  // (de texto, la url sin http ni www; de Facebook, 'facebook')
  const img = cara(p);
  if (p.foto) img.className = p.logo ? 'portada logo' : 'portada';

  d.appendChild(par);
}

// días desde hoy hasta el día y mes del evento, sin contar el año (lo de antes
// de hoy va al final, como del año que viene); sin fecha, al final del todo
function desdeHoy(p){
  if (isNaN(p.mes)) return 9999;
  const hoy = new Date(), n = (m, d) => m * 31 + d;
  return (n(p.mes, p.dia) - n(hoy.getMonth(), hoy.getDate()) + 372) % 372;
}

// Panel de fechas (roles de eventos): el año actual, YEAR, los 12 meses desde el
// actual (oct 2026 ... sep 2027) y el año siguiente. El botón con el foco (fechaSel,
// posición en FECHAS) filtra los eventos de ese año, de ese mes o, YEAR (el de inicio),
// de esos 12 meses. Sin foco (null: no es de eventos, o una sugerencia elegida), todos.
const HOY = new Date(), ANYO = HOY.getFullYear();
const MESES = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const DOCE = MESES.map((m, k) => { const d = new Date(ANYO, HOY.getMonth() + k, 1); return {anyo: d.getFullYear(), mes: d.getMonth()}; });
const ordenDe = f => f.anyo * 100 + f.mes;
const FECHAS = [{anyo: ANYO}, {doce: true}, ...DOCE, {anyo: ANYO + 1}];
const F_DOCE = 1;                                 // YEAR, el de inicio
let fechaSel = F_DOCE;
const anyoDe = p => Math.floor(p.orden / 100);   // orden: año * 100 + mes (sin fecha, 9999)
const enFecha = (p, i) => i === null || !p.evento || sinFecha(p.roles[0]) ||   // las academias y las milongas, sin fecha EVT: siempre
                          (FECHAS[i].doce ? p.orden >= ordenDe(DOCE[0]) && p.orden <= ordenDe(DOCE[11])
                                          : anyoDe(p) == FECHAS[i].anyo && (FECHAS[i].mes === undefined || p.mes == FECHAS[i].mes));
function pintaFechas(cuenta, oculto){
  // los botones: el nombre y, debajo, cuántos salen en el listado con él (cuenta(i));
  // el del foco, a la vista
  const div = $('fBotones');
  div.innerHTML = '';
  FECHAS.forEach((f, i) => {
    const b = document.createElement('button');
    b.textContent = f.doce ? 'YEAR' : f.mes === undefined ? f.anyo : MESES[f.mes];
    if (f.mes !== undefined) b.title = MESES[f.mes] + ' ' + f.anyo;   // los del año siguiente, sin confundirlos
    const n = document.createElement('small'), cuantos = cuenta(i);
    n.textContent = cuantos;
    b.appendChild(n);
    b.classList.toggle('activo', i == fechaSel);
    b.classList.toggle('vacio', !cuantos);   // sin eventos: el click no hace nada
    if (cuantos) b.onclick = () => { fechaSel = i; lugarSel = ciudadSel = null; soloBuscado = false; pinta(); };   // el país clicado se queda
    div.appendChild(b);
  });

// Panel del mapa (Leaflet, teselas de Esri): lo que sale en la
// parrilla o el listado, un círculo por lugar (más grande cuantos más hay);
// el click en uno deja (en la parrilla o el listado, el que esté) solo lo de
// ese lugar (lugarSel; otro click en él, o cambiar área, rol o fecha, lo
// quita) y el mapa no se mueve. Sin nada con posición, el panel no sale.
// Países (PAISES_GEO de datajs/paises.js): con un área elegida en el selector,
// sus países iluminados y el mapa encuadrado en sus marcadores; el click en un país lo
// ilumina, lo encuadra y deja (en la parrilla o el listado, el que esté) solo lo suyo (otro click en él, o
// cambiar área o rol, lo quita; la fecha y list no); sin nada, los marcadores de lo que sale
let mapa = null, capaMapa = null, capaPaises = null, paisSel = null, areaMapa = null, posMapa = [];   // posMapa: lo que sale, con posición
// marcadores: 'lat,lon' -> su círculo; marcaFicha: el de la ficha abierta (iluminado, sin mover el mapa)
const marcadores = new Map();
let marcaFicha = null;
// etiqueta con el nombre del país o la ciudad clicados (fija, no al pasar el ratón);
// etiquetaDe: de cuál es ('pais' o 'lugar'), para quitarla cuando se quite su selección
// La etiqueta se cierra sola a los 4 s (ETIQUETA_MS)
let tipMapa = null, etiquetaDe = null, relojEtiqueta = null;
const ETIQUETA_MS = 4000;
function etiqueta(latlng, texto, de){
  if (!tipMapa) tipMapa = L.tooltip({permanent: true, direction: 'top', offset: [0, -8]});
  tipMapa.setLatLng(latlng).setContent(texto);
  mapa.openTooltip(tipMapa);
  etiquetaDe = de;
  clearTimeout(relojEtiqueta);
  relojEtiqueta = setTimeout(() => { if (mapa) mapa.closeTooltip(tipMapa); }, ETIQUETA_MS);
}
function iluminaFicha(p){
  // el marcador de p (null: ninguno) en rojo y encima de los demás; el de antes, como estaba
  const antes = marcadores.get(marcaFicha);
  if (antes) antes.setStyle(deCiudadSel(marcaFicha) ? ESTILO_LUGAR      // el del lugar seleccionado vuelve a amarillo
                                                    : {color: BORDE_MARCA, fillColor: COLOR_MARCA, fillOpacity: 0, weight: 2});
  marcaFicha = p && p.pos ? clavePos(p.pos) : null;
  const m = marcadores.get(marcaFicha);
  if (m){ m.setStyle(ESTILO_CIUDAD); m.bringToFront(); }   // en rojo opaco
}
function cierraFicha(){
  $('detalle').classList.add('oculto');
  iluminaFicha(null);
  fichaAbierta = null;
  marcaAbierta();
}
// ciudadSel: 'País|Ciudad' de una sugerencia de ciudad (CIT): solo lo de esa ciudad
let ciudadSel = null, porLugarMapa = new Map();   // porLugarMapa: 'lat,lon' -> los de ese marcador
const ciudadDe = p => p.pais + '|' + (p.ciudad || '');
let lugarSel = null, sinEncuadre = false, areaPrevia = null;   // areaPrevia: la del selector antes de clicar un país
// mapa abierto o cerrado (botón map): al cargar, siempre abierto
let mapaAbierto = true;
// parrilla o listado (botón list)
let enListado = false;
function abreCierraMapa(){
  mapaAbierto = !mapaAbierto;
  if (!mapaAbierto) lugarSel = ciudadSel = paisSel = null;
  soloBuscado = false;   // cerrado: sin filtro de lugar ni país (no se vería por qué)
  pinta();
}   // lugarSel: 'lat,lon' del marcador clicado; sinEncuadre: repintar sin mover el mapa
const COLOR_MARCA = '#ffd8b0';   // marcadores: el --acento de la hoja de estilos (relleno)
const BORDE_MARCA = '#ffd500';   // y su borde, amarillo intenso y opaco
const COLOR_CIUDAD = '#e53935';  // el de la ficha abierta (click en el listado o la parrilla)
const ESTILO_CIUDAD = {color: COLOR_CIUDAD, fillColor: COLOR_CIUDAD, fillOpacity: 1, weight: 4};   // rojo opaco
const ESTILO_LUGAR = {color: BORDE_MARCA, fillColor: BORDE_MARCA, fillOpacity: 1, weight: 4};      // lugar seleccionado (marcador clicado o sugerencia de ciudad): amarillo opaco
const deCiudadSel = k => k == lugarSel || (ciudadSel && (porLugarMapa.get(k) || []).some(p => ciudadDe(p) == ciudadSel));
// países: borde blanco y relleno de un azul algo más claro que el mapa (el mar queda con el del mapa)
// Casi todo usa el centro de su ciudad (CIUDADES_COORD): lo que tenga coordenadas
// propias a menos de 1 km del centro de una ciudad, se cuenta como esa ciudad (mismo
// círculo, en el centro), y no salen círculos concéntricos o pegados. centroPos: el
// centro más cercano a menos de 1 km o, si no hay, la posición tal cual. Los centros,
// en celdas de 0,01° (~1,1 km): se miran la celda de la posición y las de alrededor
let _centros = null;
function centroPos(pos){
  if (!_centros){
    _centros = new Map();
    for (const c of Object.values(typeof CIUDADES_COORD == 'undefined' ? {} : CIUDADES_COORD)){
      if (!c) continue;
      const k = Math.round(c[0] * 100) + ',' + Math.round(c[1] * 100);
      if (!_centros.has(k)) _centros.set(k, []);
      _centros.get(k).push(c);
    }
  }
  const la = Math.round(pos[0] * 100), lo = Math.round(pos[1] * 100), cos = Math.cos(pos[0] * Math.PI / 180);
  let mejor = null, dMejor = 1;                  // km
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++)
    for (const c of _centros.get((la + i) + ',' + (lo + j)) || []){
      const d = 111.2 * Math.hypot(c[0] - pos[0], (c[1] - pos[1]) * cos);
      if (d <= dMejor){ mejor = c; dMejor = d; }
    }
  return mejor || pos;
}
// clave del marcador de una posición: la de su centro, redondeada a 0,001° (~100 m)
const clavePos = pos => centroPos(pos).map(x => x.toFixed(3)).join(',');
// marcador cuadrado (las list de World o de un continente): un circleMarker (mismos
// estilos, setStyle y click) dibujado como un cuadrado de lado 2 * radio (SVG)
let MarcaCuadrada = null;
function marcaCuadrada(pos, opciones){
  MarcaCuadrada = MarcaCuadrada || L.CircleMarker.extend({_updatePath(){
    const p = this._point, r = Math.max(Math.round(this._radius), 1);
    this._renderer._setPath(this, this._empty() ? 'M0 0' : `M${p.x - r},${p.y - r}h${2 * r}v${2 * r}h${-2 * r}z`);
  }});
  return new MarcaCuadrada(pos, opciones);
}
// radio del marcador según cuántos hay en el lugar: [n, px], y entre medias, en línea recta
const RADIOS = [[1, 4.5], [2, 6.75], [4, 9], [8, 11.25], [16, 13.5], [32, 15.75]];
function radioDe(n){
  for (let i = 1; i < RADIOS.length; i++){
    const [n0, r0] = RADIOS[i - 1], [n1, r1] = RADIOS[i];
    if (n <= n1) return r0 + (r1 - r0) * (n - n0) / (n1 - n0);
  }
  return RADIOS[RADIOS.length - 1][1];   // 32 o más
}
const ESTILO_PAIS = {fill: true, fillOpacity: 1, fillColor: '#22406a', weight: .6, color: '#888', opacity: 1};   // borde gris
const ESTILO_AREA = {fill: true, fillOpacity: 1, fillColor: '#2f5a8f', weight: .6, color: '#fff', opacity: 1};   // los del área elegida, más claros y borde blanco
const ESTILO_SEL  = {fill: true, fillOpacity: .15, fillColor: '#f5c211', weight: 2, color: '#fff', opacity: .5};   // el clicado: borde blanco al 50%
let _paisesEv = null;
function paisesConEventos(){
  // países con algún evento (también seminario) de hoy a 12 meses (sin día fijo: el 1)
  if (_paisesEv) return _paisesEv;
  const hoy = new Date(), fin = new Date(hoy.getFullYear() + 1, hoy.getMonth(), hoy.getDate());
  hoy.setHours(0, 0, 0, 0);
  _paisesEv = new Set(personas.filter(p => p.evento && !isNaN(p.mes) && p.orden < 999999)
                              .filter(p => { const d = new Date(anyoDe(p), p.mes, p.dia); return d >= hoy && d <= fin; })
                              .map(p => p.pais));
  return _paisesEv;
}
function estiloPaises(){
  // cada país: el clicado, los del área elegida o ninguno. Solo se pueden clicar
  // los que tienen algún evento en los próximos 12 meses (paisesConEventos), salga
  // o no con los filtros; en los demás el click no hace nada (pointer-events: none)
  if (!capaPaises) return;
  const conMarcas = paisesConEventos();
  capaPaises.eachLayer(l => {
    const enArea = areaMapa && l.feature.properties.area == areaMapa;
    l.setStyle(l === paisSel ? ESTILO_SEL : enArea ? ESTILO_AREA : ESTILO_PAIS);
    if (enArea) l.bringToFront();               // sus bordes blancos, sin pisar por los grises de al lado
    const el = l.getElement();
    if (el) el.style.pointerEvents = l.feature.properties.nombres.some(n => conMarcas.has(n)) ? '' : 'none';
  });
  if (paisSel) paisSel.bringToFront();          // el clicado, encima de todos
}
function boundsPais(l){
  // recuadro del país para encuadrarlo: su trozo más grande y los que tengan al
  // menos un cuarto de su tamaño (sin islas ni territorios lejanos: Canarias,
  // Guayana Francesa...), así el país llena el mapa
  const partes = l.getLatLngs().map(p => L.latLngBounds(p[0]));   // MultiPolygon: [polígono][anillo]
  const tam = b => (b.getNorth() - b.getSouth()) * (b.getEast() - b.getWest());
  const mayor = Math.max(...partes.map(tam));
  return partes.filter(b => tam(b) >= mayor / 4)
               .reduce((a, b) => a ? a.extend(b) : L.latLngBounds(b.getSouthWest(), b.getNorthEast()), null);
}
// vista de cada área del selector, a mano: con los polígonos saldría mal (Rusia, en
// Europe, la estiraría hasta el Pacífico)
const VISTA_AREA = {Europe: [[34, -25], [71, 45]], Asia: [[-11, 60], [55, 150]], America: [[-56, -130], [60, -34]],

function encuadra(conPos){
  // ajustado a los marcadores que salen, pero nunca más cerca que sus países: el zoom
  // máximo es el que encuadra los países (boundsPais) de esos marcadores. País clicado:

  // todos, como mucho al zoom de sus países juntos. Con zoomSnap fraccionario (L.map).

  const locales = conPos.filter(p => !p.zona);
  if (locales.length) conPos = locales;
  if (paisSel){
    const suyos = conPos.filter(p => paisSel.feature.properties.nombres.includes(p.pais));
    const bp = boundsPais(paisSel);
    return vuela(suyos.length ? L.latLngBounds(suyos.map(p => p.pos)) : bp, bp);
  }
  // área elegida en el selector: manda el selector, el área entera (y los marcadores
  // que queden fuera), aunque solo haya marcadores en un país
  if (areaMapa && VISTA_AREA[areaMapa]){
    const b = L.latLngBounds(VISTA_AREA[areaMapa]);
    for (const p of conPos) b.extend(p.pos);
    return vuela(b, null, MAS_AREA);
  }
  if (!conPos.length) return;
  const paises = new Set(conPos.map(p => p.pais));
  let tope = null;
  if (capaPaises) capaPaises.eachLayer(l => {
    if (!l.feature.properties.nombres.some(n => paises.has(n))) return;
    const bp = boundsPais(l);
    tope = tope ? tope.extend(bp) : bp;
  });
  vuela(L.latLngBounds(conPos.map(p => p.pos)), tope);
}
const MAS_PAIS = .5;                             // zoom de más sobre el que encuadra los países (vuela)
const MAS_AREA = .5;                             // y sobre el que encuadra el área elegida (continente)
function vuela(b, tope, mas = 0){
  // el cambio de zoom y posición, animado (la primera vez, sin vista aún, de golpe).
  // Centrado en b (los marcadores): el mismo margen a los dos lados de los extremos.
  // Zoom: el que encuadra b, como mucho el que encuadra tope (los países) más MAS_PAIS
  // (algo más cerca: el país llena el panel aunque se corte un poco) y 10 (la ciudad y
  // alrededores, no la calle). Margen: el del marcador más grande (que no
  // quede cortado en el borde); arriba y abajo, además el de los botones (zoom, map)
  const PAD = Math.ceil(RADIOS[RADIOS.length - 1][1]) + 4, VERT = PAD + 26;
  const z = x => mapa.getBoundsZoom(x, false, L.point(2 * PAD, 2 * VERT));
  let zoom = Math.min(z(b) + mas, 10);         // mas: zoom de más (el área elegida, MAS_AREA)
  if (tope) zoom = Math.min(zoom, z(tope.extend(b)) + MAS_PAIS);   // (los marcadores de un país sin polígono, dentro también)
  const centro = mapa.unproject(mapa.project(b.getNorthWest(), zoom).add(mapa.project(b.getSouthEast(), zoom)).divideBy(2), zoom);
  if (mapa._loaded) mapa.flyTo(centro, zoom, {duration: .8});
  else mapa.setView(centro, zoom);
}
function pintaMapa(lista, area){
  // un fallo del mapa no deja sin parrilla ni listado: se avisa bajo la barra
  $('mapaAviso').classList.add('oculto');
  try { pintaMapa0(lista, area); }
  catch (e){ avisoMapa('error en el mapa: ' + e.message); console.error(e); }
  finally { sinEncuadre = false; }               // vale solo para este repintado, se pinte o no el mapa
}
function avisoMapa(texto){
  $('mapaCaja').classList.add('oculto');
  $('bMapa').disabled = true;                    // sin mapa, el botón no sirve
  $('bMapa').textContent = '• map';               // • : no aplica
  $('bMapa').title = 'map: not available';

}
function pintaMapa0(lista, area){
  const div = $('mapa'), caja = $('mapaCaja'), conPos = posMapa = lista.filter(p => p.pos);
  // el botón, habilitado solo si este tipo usa el mapa (algo con posición); si no, deshabilitado
  // y con un punto en vez del triángulo: su estado (mapaAbierto, el d de la url) se guarda para
  // cuando se elija un tipo con mapa. Igual abierto o cerrado; el triángulo dice el estado (▴ cierra, ▾ abre)
  $('bMapa').disabled = !conPos.length;
  $('bMapa').textContent = (!conPos.length ? '•' : mapaAbierto ? '▴' : '▾') + ' map';   // • : no aplica
  $('bMapa').title = !conPos.length ? 'map: not applicable here' : 'show / hide the map';
  caja.classList.toggle('cerrado', !mapaAbierto);
  div.classList.toggle('oculto', !mapaAbierto);
  if (!mapaAbierto) return;                      // cerrado: ni se pinta (.cerrado lo oculta)
  areaMapa = area == TODOS ? null : area;       // (elegir un área quita el país clicado: conecta)
  if (typeof L == 'undefined') return avisoMapa('no se ha podido cargar Leaflet (wwt/leaflet/leaflet.js)');
  caja.classList.toggle('oculto', !conPos.length);   // nada con posición: sin panel
  if (!conPos.length) return;
  if (!mapa){
    mapa = L.map(div, {worldCopyJump: true, zoomSnap: .25});   // zoom en cuartos: el encuadre se ajusta más
    mapa.attributionControl.setPrefix(false);   // sin 'Leaflet': los créditos completos, en la ficha de info (muestraInfo)
    // teselas de Esri (gris oscuro y, encima, los nombres): gratis y sin clave. Las de
    // tile.openstreetmap.org piden Referer (desde file:// salen bloqueadas) y las de
    // CARTO, una clave de API
    const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
    L.tileLayer(ESRI + 'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
                {maxZoom: 16, className: 'teselaBase', attribution: '&copy; Esri, OpenStreetMap'}).addTo(mapa);
    // capas: teselas de fondo, países (rellenos opacos), nombres encima de ellos (sin
    // recibir clicks) y, sobre todo, los marcadores (overlayPane, 400)
    const paises = mapa.createPane('paises');
    paises.style.zIndex = 250;
    paises.style.transition = 'opacity .3s';
    // los polígonos (1:50m, a 0,01°) se ven quebrados de cerca: desde el zoom 7 se
    // atenúan (relleno y borde) hasta un 10% en el 9, y manda el fondo de Esri
    const atenua = () => paises.style.opacity = Math.max(.1, Math.min(1, 1 - (mapa.getZoom() - 7) * .45));
    mapa.on('zoomend', atenua);
    const nombres = mapa.createPane('nombres');
    nombres.style.zIndex = 260;
    nombres.style.pointerEvents = 'none';
    L.tileLayer(ESRI + 'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {maxZoom: 16, className: 'teselaNombres', pane: 'nombres'}).addTo(mapa);
    if (typeof PAISES_GEO != 'undefined'){
      capaPaises = L.geoJSON(PAISES_GEO, {pane: 'paises', style: ESTILO_PAIS, onEachFeature: (f, l) => l.on('click', e => {
        paisSel = paisSel === l ? null : l;      // otro click en el mismo: se quita
        lugarSel = ciudadSel = null;
        soloBuscado = false;
        if (paisSel) etiqueta(e.latlng, f.properties.pais, 'pais');   // su nombre, donde se ha clicado
        pinta();                                  // ilumina, encuadra y filtra (la parrilla o el listado, el que esté)
      })}).addTo(mapa);                          // antes que los círculos: quedan debajo
    }
    capaMapa = L.layerGroup().addTo(mapa);
  }
  mapa.invalidateSize();          // estaba oculto: Leaflet recalcula el tamaño
  capaMapa.clearLayers();
  const porLugar = new Map();
  for (const p of conPos){
    const k = clavePos(p.pos);
    if (!porLugar.has(k)) porLugar.set(k, []);
    porLugar.get(k).push(p);
  }
  marcadores.clear();
  porLugarMapa = porLugar;
  for (const [k, ps] of porLugar){
    // el de la ficha abierta, en rojo opaco; los del lugar seleccionado, en amarillo opaco; los normales, solo el borde
    const ciudad = deCiudadSel(k) || k == marcaFicha;
    const estilo = k == marcaFicha ? ESTILO_CIUDAD : ciudad ? ESTILO_LUGAR : {color: BORDE_MARCA, fillColor: COLOR_MARCA, weight: 2, fillOpacity: 0};
    const m = (ps.some(p => p.zona) ? marcaCuadrada : L.circleMarker)(centroPos(ps[0].pos), {radius: radioDe(ps.length), opacity: 1, ...estilo});
    m.on('click', () => {
      lugarSel = lugarSel == k ? null : k;           // lo del lugar, en la parrilla o el listado (el que esté)
      ciudadSel = null;
      soloBuscado = false;
      // el nombre del sitio y, si son varios, cuántos: su local si todos son del mismo (milongas,
      // academias), si no la ciudad (muchos sin coordenadas propias caen en su centro)
      const salas = new Set(ps.map(p => p.sala || '')), sala = salas.size == 1 ? [...salas][0] : '';
      if (lugarSel) etiqueta(centroPos(ps[0].pos), (sala || ps[0].ciudad || (ps[0].lugar || '').split(',')[0]) + (ps.length > 1 ? ' (' + ps.length + ')' : ''), 'lugar');
      sinEncuadre = true;
      pinta();
    });
    capaMapa.addLayer(m);
    marcadores.set(k, m);
    if (ciudad) m.bringToFront();
  }
  estiloPaises();
  if (etiquetaDe && !{pais: paisSel, lugar: lugarSel, ciudad: ciudadSel}[etiquetaDe]) mapa.closeTooltip(tipMapa);   // sin selección: fuera la etiqueta
  if (!sinEncuadre) encuadra(conPos);
  sinEncuadre = false;
}

// imágenes por fila en la parrilla: las que quepan de ANCHO_CARA (eventos, el doble),

// total de registros de un área (all: de todas), para su selector; se cuenta una vez
const totalesArea = new Map();
function totalArea(v){
  if (!totalesArea.has(v)) totalesArea.set(v, personas.filter(p => enArea(p, v)).length);

function pinta(){

  const val = sel => sel.value || sel.dataset.inicial || TODOS;   // al cargar aún no hay opciones: vale data-inicial

  // parrilla y listado, lo mismo: personas con foto, todos los eventos (sin foto, en la

  const areas = [...new Set(personas.map(p => p.area))].filter(x => x != MUNDIAL)
                  .sort((x, y) => (x == '-') - (y == '-') || x.localeCompare(y));

  opciones($('selRol'), [{grupo: 'events', valores: [LIS, EVT, SEM, ACA, MIL]},
                         {grupo: 'people', valores: [PEO, 'org', 'art', ...Object.keys(ROLES).filter(v => !(v in PRIMEROS))]}],
           v => PRIMEROS[v] || TEXTO_ROL[v] || ROLES[v].nombre || v,
           v => personas.filter(p => enArea(p, areaCuenta) && enRol(p, v)).length);   // totales del tipo en el área elegida (con foto o sin ella, sin mirar la fecha)
  const conFechas = deEventos(r) && !sinFecha(r);   // el panel de fechas, solo con eventos (las academias y las milongas no tienen fecha EVT)
  const fs = conFechas && !soloBuscado ? fechaSel : null;   // sin él, o con una sugerencia elegida, sin filtro de fecha
  $('fechas').classList.remove('oculto');

  // lo de un marcador o un país clicados (también para las cuentas del panel de fechas)
  const enSel = p => (!lugarSel || (p.pos && clavePos(p.pos) == lugarSel))
                  && (!ciudadSel || ciudadDe(p) == ciudadSel)
                  && (!paisSel || paisSel.feature.properties.nombres.includes(p.pais));

  const rFechas = conFechas ? r : EVT;
  pintaFechas(i => deListado.filter(p => enArea(p, a) && enRol(p, rFechas) && enFecha(p, i) && enSel(p)).length, !conFechas);

  const base = visibles.filter(p => enArea(p, a) && enRol(p, r) && enFecha(p, fs));   // lo que sale

  // Las list de World, en el mapa solo con World (todas las áreas) elegido
